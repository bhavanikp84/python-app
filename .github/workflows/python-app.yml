# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    # 4. Start the Flask app in the background
    - name: Run Flask App
      run: |
        python src/app.py &
        # Give the server a few seconds to start up
        sleep 3

    # 5. Test endpoints using curl
    - name: Test Home Endpoint (/)
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/)
        echo "Home status code: $response"
        [ "$response" -eq 200 ]

    - name: Test Details Endpoint (/api/v1/details)
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/v1/details)
        echo "Details status code: $response"
        [ "$response" -eq 200 ]

    - name: Test Healthz Endpoint (/api/v1/healthz)
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/v1/healthz)
        echo "Healthz status code: $response"
        [ "$response" -eq 200 ]
